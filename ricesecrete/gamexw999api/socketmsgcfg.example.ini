;是否开启调试模式 0 不开启 1开启
debug=0
; 开启消息服务 0 不开启 1开启
open=0
;服务器健康检查时间（秒）
srvhealth=5;
;用户超时时间（秒）客户端心跳时间设置值须低于此值
usrhealth=10;
;用户uid前缀 默认为default 不允许有_
userprefix=

;重复发送消息设置-消息发送不成功时遵循此设置进行发送
[resendcfg]
;设置未送达消息依次隔多少分钟重发一次，直到发送成功或发送超时(仅支持按人发送的消息)
;失败重复发送分钟数最高605分钟
resendsteplist=1,1,1,1,1,5,5,5,5,5,10,10,10,10,10,15,15,15,15,15,30,30,30,30,30,60,60,60,60,60

[onlinecount]
;是否开启统计 开启统计的情况下请同时执行command中关于socketPlugin统计在线的相关任务--通用设置
opencount=1
;统计间隔秒数--通用设置默认5 不建议大于30
countstep=5
;中间结果缓存条数,根据在线用户数会占用redis的内存空间和读写io，不建议设置过大，此值的主要作用是保证短时阻塞时不会丢失用户在线数据,
;建议设置为消息服务器对接的最大项目用户数/5000*3 --通用设置 默认600：按100万用户计
cachedatanum=600
;数据库每轮处理在线消息条数，此设置为每个项目根据自身mysql服务器能力进行设置,默认50000,设置为5000的倍数为佳
procdatanums=100000
;疑似下线无动作分钟数,默认60
maybeofflinemin=60

[redis]
host=redis
password=
dbidx=7

[server]
;服务器名称 主服务器的名字将固定为MsgServerMaster
srvname=MsgServerMaster
;服务器类型 mst 主服务器，负责负载分配 slv副服务器
type=mst
;外网服务ip
nethost=s.football.test
;服务器绑定IP
host=0.0.0.0
;服务器绑定端口
port=12123
;最高接受连接队列数，对于主服务器设定的是当provide=1时服务的连接数，主服务器不建议设置过高
maxconn=10000
;主服务器每轮分发消息条数/副服务器每轮处理消息的条数
issuemsgnum=1000

;通过命令行参数的第一个参数指定分段名调用此配置，默认为server
[server1]
srvname=msgslv
;服务器类型 mst 主服务器，负责负载分配 slv副服务器
type=slv
;外网服务ip
nethost=s.football.test
;服务器绑定IP
host=0.0.0.0
;服务器绑定端口
port=12134
;最高接受连接队列数，对于主服务器设定的是当provide=1时服务的连接数，主服务器不建议设置过高
maxconn=10000
;主服务器每轮分发消息条数/副服务器每轮处理消息的条数
issuemsgnum=1000
