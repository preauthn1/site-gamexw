<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{:lang('反波胆平台')}</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  {include file="public/header" /}
</head>
<body>  
<div class="layui-form" style="margin-top: 20px;" id="apps">
<div class="layui-tab">
    <ul class="layui-tab-title">
        <li class="layui-this">{:lang('代理报表')}</li>
        <li data-type="layerList" onclick="window.location.href = '/agent_report/user';">{:lang('下层列表')}</li>    
        <li style="float: right; text-align: right;">
            <button type="button" class="layui-btn layui-btn-xs" onclick="location.reload();">
              <i class="layui-icon">&#xe9aa;</i>
            </button> 
        </li>
    </ul>
</div>

<div class="demoTable" style="text-align: center;">
    <div class="layui-inline" style="float: left; margin: 0 0 10px 20px;">
        <button class="layui-btn " data-type="return" style="background: #fff; color: #000; border:1px solid #e6e6e6;">{:lang('返回')}</button>
        <font style=" font-weight: bold;">{$user.username}</font> {:session('lang_data.public.b_level_p')}:{$count_pnumber}
    </div>
    <!--div class="layui-btn-group " style="float: right; margin-right: 20px;">
        <button class="layui-btn " data-type="excel">{:lang('汇出')}</button>
    </div-->
</div>
<hr>
<div class="demoTable" style="text-align: center;">
    
    <div class="layui-inline">
      <input class="layui-input" id="date" placeholder="{:lang('开始时间')}-{:lang('结束时间')}">
    </div>
  <div class="layui-inline">
      <input class="layui-input" id="username" v-model="query.username" placeholder="{:lang('用户名')}">
  </div>
    <div class="layui-inline">
        <input class="layui-input" id="rec_code" v-model="query.rec_code" placeholder="{:lang('推广码')}">
    </div>
  <button class="layui-btn" data-type="reload">{:lang('搜索')}</button>
</div>
<hr>

<table class="layui-hide" id="table" lay-filter="table"></table>
 
<script type="text/html" id="bar">
  <a class="layui-btn layui-btn-xs" lay-event="show">{:lang('查看')}</a>
  <a class="layui-btn layui-btn-xs" lay-event="subordinate">{:lang('下级')}</a>
</script>
</div>

{include file="public/botton" /}
<script>
var vm = new Vue({
        el: '#apps',
        data: {
            query:{
                s_date:"",
                username:"",
                rec_code:"",
                date:"",
            },
            searchData:{
                
            }
        },
        mounted(){
          this.init();
        },
        methods:{
            init: function() {
              var _this=this;
                layui.use(['form','laydate','element','table'], function(){
                var table = layui.table;
                _this.form = layui.form;
                _this.laydate = layui.laydate;
                _this.$=layui.$;
                _this.table = layui.table;
                
                table.render({
                      elem: '#table',
                      url:'/agent_report/index?select=true&id={$id}',
                      response:{
                          statusCode: 1 //规定成功的状态码，默认：0
                      },
                      text: {
                          none: '{:lang('暂无数据')}' //默认：无数据。
                      },
                      page: true,
limits:[10,20,30,40,50,60,70,80,90,500,1000],
                  cols: [[
                      {field:"username", title: "{:lang('用户名')}",templet:function(d){
                        var str="";
                        if (d.is_agnet==true) {
                          return "<span style='color:red;'>"+d.username+"<span>";
                        }else{
                          return d.username;
                        }
                        
                      }},
                      {field:"count_pnumber", title: "{:lang('下级总人数')}"},
                      {field:"new_reg", title: "{:lang('新注册人数')}"},
                      {field:"recharge_pnumber", title: "{:lang('充值人数')}"},
                      {field:"recharge_amount", title: "{:lang('充值')}{:lang('金额')}"},
                      {field:"first_recharge_pnumber", title: "{:lang('首充人数')}"},
                      {field:"first_recharge_zb", title: "{:lang('首充')}{:lang('比例')}"},
                      {field:"two_recharge_pnumber", title: "{:lang('复充人数')}"},
                      {field:"two_recharge_zb", title: "{:lang('复充')}{:lang('比例')}"},
                      {field:"withdrawal_amount", title: "{:lang('提现')}{:lang('金额')}"},
                      {field:"withdrawal_pnumber", title: "{:lang('提现')}{:lang('人数')}"},
                      {field:"zd_price", title: "{:lang('投注')}{:lang('金额')}"},
                      {field:"zd_pnumber", title: "{:lang('投注')}{:lang('人数')}"},
                      {field:"max_level", title: "{:lang('所属层级')}"},
                      {title: "{:lang('操作')}", align:'center', toolbar: '#bar'}
                  ]]
                });

                //监听工具条
                table.on('tool(table)', function(obj){
                  var data = obj.data;
                  var url="";

                  if(obj.event == 'show'){
                      url='/agent_report/user?username='+data.username;
                      window.location.href = url;
                  }
                    if(obj.event == 'subordinate'){
                        url='/agent_report/index?id='+data.uid;
                        window.location.href = url;
                    }
                });

                var $ = layui.$, active = {
                      excel: function(){
                          var date = $('#date').val();
                          var username = $('#username').val();
                          var rec_code = $('#rec_code').val();
                          $patt = '&date='+date+'&username='+username+'&rec_code='+rec_code
                          window.location.href='/agent_list/excel?id={$user.id}'+$patt

                          //添加
                          //   layer.open({
                          //     type: 2,
                          //     title: "{:lang('汇出')}",
                          //     shadeClose: true,
                          //     shade: 0.8,
                          //     area: ['90%', '90%'],
                          //     content: '/agent_list/excel?id={$user.id}' //iframe的url
                          //   });
                      },
                      return:function(){
                          url='/agent_report/index';
                          window.history.go(-1);
                      },
                      layerList:function(){
                          url='/agent_report/user';
                          window.location.href = url;
                      },
                  reload: function(){
                    var username = $('#username').val();
                    var rec_code = $('#rec_code').val();
                    _this.query.date = $("#date").val();
                    //执行重载
                    table.reload('table', {
                      page: {
                        curr: 1 //重新从第 1 页开始
                      },
                      where: _this.query
                    }, 'data');
                  }
                };

                $('.demoTable .layui-btn').on('click', function(){
                  var type = $(this).data('type');
                  active[type] ? active[type].call(this) : '';
                });
              });
            },
        }        
  });
</script>
<script type="text/javascript">
    laydate.render({
        elem: '#date',
        type: 'date',
        range: true,
        lang_text:{'select_time':'{:lang('选择时间')}','start_time':'{:lang('开始时间')}','end_time':'{:lang('结束时间')}','return_date':'{:lang('返回日期')}','confirm':'{:lang('确定')}','clear':'{:lang('清空')}','now':'{:lang('现在')}','year':'{:lang('年')}','month':'{:lang('月')}','one':'{:lang('一')}','two':'{:lang('二')}','three':'{:lang('三')}','four':'{:lang('四')}','five':'{:lang('五')}','six':'{:lang('六')}','seven':'{:lang('日')}','time':'{:lang('时')}','min':'{:lang('分')}','second':'{:lang('秒')}',},
        extrabtns: [
            {id: 'today', text: '{:lang('今天')}', range: [new Date(), new Date()]},
            {id: 'yesterday', text: '{:lang('昨天')}', range: [new Date(new Date().setDate(new Date().getDate()-1)), new Date(new Date().setDate(new Date().getDate()-1))]},
            {id: 'lastday-7', text: '{:lang('近7天')}', range: [new Date(new Date().setDate(new Date().getDate()-7)), new Date(new Date().setDate(new Date().getDate()-1))]},
            {id: 'lastday-30', text: '{:lang('近30天')}', range: [new Date(new Date().setDate(new Date().getDate()-30)), new Date(new Date().setDate(new Date().getDate()-1))]},
            {id: 'thismonth', text: '{:lang('本月')}', range: [new Date(new Date().setDate(1)),new Date(new Date(new Date().setMonth(new Date().getMonth()+1)).setDate(0))]},
            {id: 'lastmonth', text: '{:lang('上月')}', range: [new Date(new Date(new Date().setMonth(new Date().getMonth()-1)).setDate(1)),new Date(new Date().setDate(0))]}
        ],
        done: function(val, stdate, ovdate){
            //当确认选择时间后调用这里
        }
    });
</script>
</body>
</html>
