<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{:lang('反波胆平台')}</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  {include file="public/header" /}
  <style type="text/css">
      .clerk_item{
        color: #1E9FFF;
        text-decoration:underline  ;
      }
  </style>
</head>
<body>  

<div class="layui-form" style="padding:15px;" id="apps">
            <table class="layui-hide" id="table" lay-filter="table"></table>          	
</div>

</div>
<style type="text/css">
</style>
{include file="public/botton" /}
<script src="/static/admin/js/echarts.js"></script>
<script>

    var vm = new Vue({
        el: '#apps',
        data: {
            query:{
                s_date:"{$param.s_date}",
              	username:"{$param.username}",
              	rec_code:"{$param.rec_code}",
              	date:"{$param.date}",
              	rec_level:"{$param.rec_level}",
                type:"{$param.type}"
            },
            searchData:{
                
            }
        },
        mounted(){
          this.init();
        },
        methods:{
            init: function() {
            	var _this=this;
                layui.use(['form','laydate','element','table'], function(){
                    _this.form = layui.form;
                    _this.laydate = layui.laydate;
                    _this.$=layui.$;
                    _this.table = layui.table;
                    let cols = []
                    if({$param.type} == 6){ //充值列表的时候
                        cols = [[
                            {field:"channel_name", title: "{:lang('数据来源')}"},
                            {field:"username", title: "{:lang('用户名')}", templet:function(d){
                                return '<a style="color: #1E9FFF;" lay-event="base">'+d.username+'</a>'
                            }},
                            {field:"order_sn", title: "{:lang('订单号')}"},
                            {field:"add_time", title: "{:lang('申请时间')}"},
                            {field:"apply_price", title: "{:lang('申请金额')}"},
                            {field:"arrival_price", title: "{:lang('到账金额')}",templet:function(d){
                                return '<a style="color: #FFD700;">'+d.arrival_price+'</a>'
                            }},
                            {field:"update_time", title: "{:lang('审核时间')}"},
                            {field:"pay_name", title: "{:lang('支付渠道')}"},
                            {field:"admin_name", title: "{:lang('操作员')}"},
                            {field:"remarks", title: "{:lang('备注')}"},
                        ]]
                    }else{
                       cols = [[
                          {field:"id", title: "ID"},
                          {field:"username", title: "{:lang('用户名')}", templet:function(d){
                                return '<a style="color: #1E9FFF;" lay-event="base">'+d.username+'</a>'
                            }},
                          {field:"rec_level", title: "{:lang('所属层级')}"},
                          {field:"rec_code", title: "{:lang('推广码')}"},
                          {field:"rec_name", title: "{:lang('推广用户')}"},
                          {field:"balance", title: "{:lang('余额')}"},
                          {field:"recharge", title: "{:lang('充值总额')}"},
                          {field:"withdrawal", title: "{:lang('提现总额')}"},
                          {field:"zd_price", title: "{:lang('注单金额')}"},
                          {field:"zd_number", title: "{:lang('注单数')}"},
                          {field:"win_price", title: "{:lang('总')}{:lang('赢')}"},
                          {field:"lose_price", title: "{:lang('总')}{:lang('输')}"},
                          {field:"add_time", title: "{:lang('注册')}{:lang('时间')}"},
                        ]]
                    }
                    _this.table.render({
                        elem: '#table',
                        url:'/agent_report/user_data?level=true',
                        where:_this.query,
                        response:{
                            statusCode: 1 //规定成功的状态码，默认：0
                        },
                         text: {
                            none: '{:lang('暂无数据')}' //默认：无数据。
                        },
                        parseData: function(res){ //res 即为原始返回的数据
                              return {
                                "code": res.code, //解析接口状态
                                "msg": res.msg, //解析提示文本
                                "count": res.data.total, //解析数据长度
                                "data": res.data.data //解析数据列表
                              };
                          },
                        page: true,
                        limits:[10,20,30,40,50,60,70,80,90,500,1000],
                        cols: cols
                    });
                    //监听工具条
                    _this.table.on('tool(table)', function(obj){
                      var data = obj.data;
                      let url,id
                      if({$param['type']} == 6){
                            id = data.uid
                      }else{
                            id = data.id
                      }
                      if(obj.event == 'base'){
                          url='/user/base?id='+id;
                        }
                        layer.open({
                            type: 2,
                            title: "{:lang('编辑')}",
                            shadeClose: true,
                            shade: 0.8,
                            area: ['90%', '90%'],
                            content: url //iframe的url
                        });
                    });
            	});
            },
      }
  })

</script>

</body>
</html>
