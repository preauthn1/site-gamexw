<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{:lang('反波胆平台')}</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  {include file="public/header" /}
</head>
<body>  
<style type="text/css">
	.iframes{
		width: 100%;
		height: 600px;
		border: none;
	}
	.details_button{
		padding:15px;
	}
	.layui-btn{
		margin-right:15px;
	}
</style>

<form class="layui-form" id="apps">
  	<div class="layui-tab layui-tab-card">
	    
	    <div class="layui-tab-content">
	    	<div class="layui-tab-item layui-show">
	    		<div class="layui-form-item">
				    <label class="layui-form-label">{:lang('用户名')}</label>
				    <div class="layui-input-block">
				      <input type="text" v-model="info.username" placeholder="{:lang('用户名')}" class="layui-input layui-disabled" disabled="">
				    </div>
			  	</div>

			  	<div class="layui-form-item">
				    <label class="layui-form-label">{:lang('余额')}</label>
				    <div class="layui-input-block">
				      <input type="text" v-model="info.balance" placeholder="{:lang('余额')}" class="layui-input layui-disabled" disabled="">
				    </div>
			  	</div>

				<div class="layui-form-item">
					<label class="layui-form-label">{:lang('积分')}</label>
					<div class="layui-input-block">
						<input type="text" v-model="info.integral" placeholder="{:lang('余额')}" class="layui-input layui-disabled" disabled="">
					</div>
				</div>

			  	<div class="layui-form-item">
				    <label class="layui-form-label">{:lang('定期基金余额')}</label>
				    <div class="layui-input-block">
				      <input type="text" v-model="info.set_fund_money" placeholder="{:lang('基金余额')}" class="layui-input layui-disabled" disabled="">
				    </div>
			  	</div>

			  	<div class="layui-form-item">
				    <label class="layui-form-label">{:lang('活期基金余额')}</label>
				    <div class="layui-input-block">
				      <input type="text" v-model="info.live_fund_money" placeholder="{:lang('基金余额')}" class="layui-input layui-disabled" disabled="">
				    </div>
			  	</div>

				<div class="layui-form-item">
					<label class="layui-form-label">{:lang('真实姓名')}</label>
					<div class="layui-input-block">
						<input type="text" v-model="info.real_name" placeholder="{:lang('真实姓名')}" class="layui-input">
					</div>
				</div>

				<div class="layui-form-item">
					<label class="layui-form-label">{:lang('邮箱')}</label>
					<div class="layui-input-block">
						<input type="text" v-model="info.mail" placeholder="{:lang('邮箱')}" class="layui-input">
					</div>
				</div>

				<div class="layui-form-item">
					<label class="layui-form-label">{:lang('最低下注')}</label>
					<div class="layui-input-block">
						<input type="text" v-model="info.limit_min" placeholder="{:lang('最低下注')}" class="layui-input">
					</div>
				</div>

				<div class="layui-form-item">
					<label class="layui-form-label">{:lang('最高下注')}</label>
					<div class="layui-input-block">
						<input type="text" v-model="info.limit_max" placeholder="{:lang('最高下注')}" class="layui-input">
					</div>
				</div>

				<div class="layui-form-item">
					<label class="layui-form-label">{:lang('单场最高下注')}</label>
					<div class="layui-input-block">
						<input type="text" v-model="info.limit_sum_max" placeholder="{:lang('单场最高下注')}" class="layui-input">
					</div>
				</div>

				<div class="layui-form-item">
				    <label class="layui-form-label">{:lang('会员等级')}</label>
				    <div class="layui-input-block">
				    	<select name="level_id">
                                            <option v-for="(v,k) in vip" :value="v.key" :selected="info.level_id==v.key">{{v.name}}</option>
				    	</select>
				    </div>
				</div>

			  	<div class="layui-form-item">
				    <label class="layui-form-label">{:lang('推广码')}</label>
				    <div class="layui-input-block">
				      <input type="text" v-model="info.rec_code" placeholder="{:lang('推广码')}" class="layui-input layui-disabled" disabled>
				    </div>
			  	</div>

				<div class="layui-form-item">
					<label class="layui-form-label">{:lang('备注')}</label>
					<div class="layui-input-block">
						<input type="text" class="layui-input"  v-model="info.remark" value="info.remark" placeholder="{:lang('备注')}">
					</div>
				</div>

			  	<div class="layui-form-item">
					<div class="layui-inline">
					    <label class="layui-form-label">{:lang('注册时间')}/ip</label>
					    <div class="layui-input-block">
					      <input type="text" placeholder="{:lang('注册时间')}/ip" class="layui-input layui-disabled" disabled :value="info.add_time+'/'+info.reg_ip">
					    </div>
				    </div>
				    <div class="layui-inline">
					    <label class="layui-form-label">{:lang('登录时间')}/ip</label>
					    <div class="layui-input-block">
					      <input type="text" placeholder="{:lang('登录时间')}/ip" class="layui-input layui-disabled" disabled :value="info.login_time+'/'+info.end_login_ip">
					    </div>
				    </div>
				</div>
                                <div class="layui-form-item">
                                    <label class="layui-form-label">{:lang('区号')}</label>
                                    <div class="layui-input-block">
                                        <input type="text" v-model="info.qh" placeholder="{:lang('区号')}" class="layui-input" >
                                    </div>
				</div>
			  	<div class="layui-form-item">
				    <label class="layui-form-label">{:lang('手机号码')}</label>
				    <div class="layui-input-block">
				      <input type="text" v-model="info.phone" placeholder="{:lang('手机号码')}" class="layui-input" >
				    </div>
			  	</div>

			  	<div class="layui-form-item">
				    <label class="layui-form-label">{:lang('登录密码')}</label>
				    <div class="layui-input-block">
				      <input type="text" v-model="info.new_password" placeholder="{:lang('登录密码')}" class="layui-input" >
				    </div>
			  	</div>
                                
                                <div class="layui-form-item">
				    <label class="layui-form-label">{:lang('提现密码')}</label>
				    <div class="layui-input-block">
				      <input type="text" v-model="info.withdrawal_pwd" placeholder="{:lang('提现密码')}" class="layui-input" >
				    </div>
			  	</div>
                    
			  	<div class="layui-form-item">
				    <label class="layui-form-label">{:lang('手机验证')}</label>
				    <div class="layui-input-block">
				      <input type="checkbox" lay-filter="is_check_phone" lay-skin="switch" lay-text="{:lang('需要')}|{:lang('不需要')}" :checked="info.is_check_phone == 1">
				    </div>
				</div>

			  	<div class="layui-form-item">
				    <label class="layui-form-label">{:lang('用户标签')}</label>
				    <div class="layui-input-block">
				      <input type="radio" name="lebal" value="1" title="{:lang('一般用户')}" :checked="info.lebal==1">
				      <input type="radio" name="lebal" value="2" title="{:lang('测试用户')}" :checked="info.lebal==2">
				    </div>
				</div>

				<div class="layui-form-item">
				    <label class="layui-form-label">{:lang('用户状态')}</label>
				    <div class="layui-input-block">
				      <input type="radio" name="status" value="1" title="{:lang('开启')}" :checked="info.status==1">
				      <input type="radio" name="status" value="0" title="{:lang('禁用')}" :checked="info.status==0">
				    </div>
				</div>
                                <div class="layui-form-item">
				    <label class="layui-form-label">{:lang('上架账号')}</label>
				    <div class="layui-input-block">
				      <input type="radio" name="sc_date" value="1" title="{:lang('开启')}" :checked="info.sc_date==1">
				      <input type="radio" name="sc_date" value="0" title="{:lang('禁用')}" :checked="info.sc_date==0">
				    </div>
				</div>
				<div class="layui-form-item">
				    <div class="layui-input-block">
				      <button type="button" class="layui-btn" @click="submitData">{:lang('保存')}</button>
				    </div>
			  	</div>
	    	</div>

	    </div>
    </div>	
</form>
               
          
{include file="public/botton" /}

<script>

var vm = new Vue({
        el: '#apps',
        data: {
        	info:{
                    id:"{$id}",
                    username:"",
                    mail:"",
                    real_name:"",
                    betamount:"",
                    password:"",
                    withdrawal_pwd:"",
                    is_check_phone:1,
                    lebal:1,
                    status:1,
                    level_id:1,
                    top_code:"",
                    is_agent:0,
                    limit_min:0,
                    limit_max:0,
                    limit_sum_max:0,
                    mail:'',
                    remark:'',
                    set_fund_money:0,
                    live_fund_money:0,
                    remark:'',
                    sc_date:0
        	},
        	vip:[
        		{name:"vip0",key:"1",},
        		{name:"vip1",key:"2",},
        		{name:"vip2",key:"3",},
        		{name:"vip3",key:"4",},
        		{name:"vip4",key:"5",},
        		{name:"vip5",key:"6",},
        		{name:"vip6",key:"7",},
        		{name:"vip7",key:"8",},
        		{name:"vip8",key:"9",},
        		{name:"vip9",key:"10",},
        		{name:"vip10",key:"11",},
        	],
        	form:null,
        	$:null,
        },
        mounted(){
        	this.getData();
        },
        methods: {
          	init: function() {
          		var _this=this;
		        layui.use(['form','laydate','element'], function(){
                            _this.form = layui.form;
                            _this.$=layui.$;
                            _this.form.on("radio",function(data){
                                    _this.info[data.elem.name]=data.value;
                            });
                            _this.form.on("select",function(data){
                                _this.info[data.elem.name]=data.value;
                            });
                             _this.form.on('switch(is_check_phone)', function(data){
		                        _this.info[data.elem.getAttribute('lay-filter')]=data.elem.checked?"1":"0";
		                    });
                        });
	        },
	        getData(){
	        	var _this=this;
		        adminRequest('/user/edit',{find:true,id:this.info.id}).then(function (response) {	
		        	_this.info=response.data.data;
					_this.init();
				});
	        },
	        submitData:function(){
	        	adminRequest('/user/edit',{edit:true,info:this.info}).then(function (response) {
						layer.msg(response.data.msg,{
				        	time:1500
				        },function(){
				        	if (response.data.code==1){
								//location.reload();
							}
				        });
				});
	        },
	        open_where(title,url,w,h){
	        	$l.open(title,url,w,h)
	        }
      }
    })
</script>
</body>
</html>
