<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{:lang('反波胆平台')}</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  {include file="public/header" /}
</head>
<body>  
<style type="text/css">
	.slider{
		margin: 20px 0;
	}
</style>

<form class="layui-form" style="margin-top: 20px;" id="apps">
  
  	<div class="layui-bg-gray" style="padding: 30px;">
		<div class="layui-row layui-col-space15">
			<div class="layui-col-md6">
			  <div class="layui-card">
			    <div class="layui-card-header">{:lang('成交量预警')}</div>
			    <div class="layui-card-body">
			      	<div id="turnover" class="slider"></div>
			      	<button type="button" class="layui-btn" @click="submitData">{:lang('保存')}</button>
			    </div>
			  </div>
			</div>
		</div>
	</div> 

</form>
               
{include file="public/botton" /}

<script>

var vm = new Vue({
        el: '#apps',
        data: {
            info:{
                turnover:0,
                turnover:0,
            },
            form:null,
            $:null,
        },
        mounted(){
        	this.getData();
        },
        methods: {
            init: function() {
                var _this=this;
            	layui.use(['form','slider'], function(){
          			_this.form = layui.form;
          			_this.$=layui.$;
          			_this.slider=layui.slider;
                                _this.slider.render({
                                    elem: '#turnover',
                                    value:_this.info.turnover,
                                    setTips: function(value){ //自定义提示文本
                                        return value + '%';
                                    },
                                    change: function(value){
                                        _this.info.turnover=value[0]+value[1]; //得到开始值
                                    }
                                });
      			});
        	},
        	getData(){
                    //获取数据
                    var _this=this;
                    adminRequest('/index/set',{find:true}).then(function (response) {
                        _this.info=response.data.data;
                        _this.init();
                    });
        	},
        	submitData:function(){
                    adminRequest('/index/set',{edit:true,info:this.info}).then(function (response) {	
                        layer.msg(response.data.msg,{
                            time:1500
                        },function(){
                            if (response.data.code==1){
                                location.reload();
                            }
    		        });
                    });
        	}
      }
    })
</script>
</body>
</html>
